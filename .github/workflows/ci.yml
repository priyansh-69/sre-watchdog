name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. Code Quality & Formatting Gate
  # =========================================================================
  code-quality:
    name: Code Quality (isort & black)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install code quality tools
        run: |
          python -m pip install --upgrade pip
          pip install black>=23.0.0 isort>=5.12.0

      - name: Check import ordering (isort)
        run: |
          isort --profile black --check-only --diff src/ tests/

      - name: Check code formatting (black)
        run: |
          black --check --diff src/ tests/

  # =========================================================================
  # 2. Static Type Analysis Gate
  # =========================================================================
  type-check:
    name: Static Analysis (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & mypy
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run strict type checking
        run: |
          mypy --strict src/agentic_sre

  # =========================================================================
  # 3. Security Vulnerability Audit (SAST)
  # =========================================================================
  security-audit:
    name: Security Audit (bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit>=1.7.0

      - name: Run AST security scan
        run: |
          bandit -r src/

  # =========================================================================
  # 4. Multi-Version Matrix Test Suite (Unit, Chaos & Async Tests)
  # =========================================================================
  test-matrix:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Execute test suite with pytest
        run: |
          pytest -v --durations=10

  # =========================================================================
  # 5. CI Gatekeeper (Required Branch Protection Status Check)
  # =========================================================================
  ci-status:
    name: CI Pipeline Status Check
    needs: [code-quality, type-check, security-audit, test-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate pipeline results
        run: |
          if [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.security-audit.result }}" != "success" ] || \
             [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "❌ CI Pipeline Failed! One or more required quality gates did not pass."
            exit 1
          fi
          echo "✅ All CI gates passed successfully. Ready to merge."
